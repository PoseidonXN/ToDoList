<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="To-Do List" />
  <link rel="apple-touch-icon" href="Icon_180x180.png" />
  <link rel="icon" type="image/png" href="Icon.png" />

  <!-- 內嵌 PWA Manifest -->
  <link rel="manifest" href='data:application/manifest+json;utf-8,%7B%22name%22%3A%22To-Do%20List%22%2C%22short_name%22%3A%22To-Do%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FBF9F5%22%2C%22theme_color%22%3A%22%23FBF9F5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22Icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22Icon_180x180.png%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D' />

  <title>To-Do List</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="appBody" class="min-h-screen flex flex-col items-center p-3 sm:p-8 relative">

  <!-- 鼓勵讚賞 Toast 提示 -->
  <div id="praiseToast" class="fixed bottom-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border">
    <span class="text-base" id="toastIcon">✨</span>
    <span id="toastMessage" class="text-xs font-medium">做得好！又邁進咗一步！</span>
  </div>

  <main class="w-full max-w-2xl space-y-5 pb-16">
    
    <!-- 頂部置中標題與工具列 -->
    <header id="appHeader" class="flex flex-col items-center gap-3.5 border-b pb-4 w-full">
      <div class="flex items-center justify-between w-full px-1">
        <div class="w-16"></div>
        <h1 id="appTitle" class="text-2xl sm:text-3xl font-bold tracking-tight text-center flex-1">To-Do List</h1>
        <div class="w-16 flex justify-end">
          <button id="authBtn" onclick="handleAuthAction()" class="text-xs px-2.5 py-1 rounded-xl border opacity-80 hover:opacity-100 transition">
            登入
          </button>
        </div>
      </div>
      
      <!-- 功能按鈕列 -->
      <div class="flex items-center justify-center gap-2 flex-wrap w-full">
        <select id="themeSelector" onchange="changeTheme(this.value)" class="px-2.5 py-1.5 rounded-xl border text-xs font-medium focus:outline-none cursor-pointer">
          <option value="warm">📜 溫暖紙感</option>
          <option value="apple">🍏 原生蘋果</option>
          <option value="linear">⚡ 黑曜高效</option>
        </select>
        <button onclick="openPraiseModal()" id="praiseBtn" class="px-2.5 py-1.5 rounded-xl border text-xs font-medium transition flex items-center gap-1">
          💬 鼓勵庫
        </button>
        <button id="sortBtn" onclick="toggleSortMode()" class="px-2.5 py-1.5 rounded-xl border text-xs font-medium transition">
          依 Deadline 排序
        </button>
        <button onclick="promptBatchDelete()" id="batchDelBtn" class="px-2.5 py-1.5 rounded-xl border text-xs font-medium transition">
          批次刪除
        </button>
      </div>
    </header>

    <!-- 清單分類切換欄 (Tabs) 支援拖曳排序與長按選單 -->
    <section class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <div id="listTabsContainer" class="flex items-center gap-2 flex-nowrap"></div>
      <button onclick="promptAddNewList()" id="addListBtn" class="px-3.5 py-1.5 rounded-xl border border-dashed text-xs font-medium whitespace-nowrap transition flex-shrink-0">
        ＋ 新增清單
      </button>
    </section>

    <!-- 新增 Task 輸入卡片 -->
    <section id="inputCard" class="p-4 rounded-2xl border space-y-3 transition-all">
      <div class="flex gap-2">
        <input id="taskInput" type="text" placeholder="新增待辦事項..." class="flex-1 px-3 py-2 text-sm rounded-xl border focus:outline-none transition" />
        <button onclick="addTask()" id="submitTaskBtn" class="px-4 py-2 rounded-xl text-sm font-semibold transition">
          加入
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs pt-1">
        <div class="flex items-center gap-1.5">
          <span class="opacity-60 flex-shrink-0">歸屬清單:</span>
          <select id="taskTargetList" class="w-full border rounded-lg px-2 py-1.5 focus:outline-none"></select>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="opacity-60 flex-shrink-0">優先程度:</span>
          <select id="taskPriority" class="w-full border rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="High">高</option>
            <option value="Medium" selected>中</option>
            <option value="Low">低</option>
          </select>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="opacity-60 flex-shrink-0">截止日期:</span>
          <input id="taskDueDate" type="date" class="w-full border rounded-lg px-2 py-1.5 focus:outline-none" />
        </div>
      </div>
    </section>

    <!-- 進行中列表 (Active Tasks) -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 id="activeHeader" class="text-xs font-bold tracking-wider uppercase opacity-70">待辦事項 (<span id="activeCount">0</span>)</h2>
        <span class="text-[11px] opacity-50">當前視圖動態編號</span>
      </div>
      <ul id="activeList" class="space-y-2"></ul>
    </section>

    <!-- 已完成列表 (Completed Tasks) -->
    <section id="completedSection" class="space-y-3 pt-4 border-t">
      <div class="flex justify-between items-center px-1">
        <h2 id="completedHeader" class="text-xs font-bold tracking-wider uppercase opacity-70">已完成任務 (<span id="completedCount">0</span>)</h2>
        <span class="text-[11px] opacity-50">最新完成置頂</span>
      </div>
      <ul id="completedList" class="space-y-2 opacity-85"></ul>
    </section>

  </main>

  <!-- iOS 長按清單彈出的 Action Sheet Modal -->
  <div id="tabActionModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm hidden items-end sm:items-center justify-center p-4 z-50 transition-opacity">
    <div id="tabActionBox" class="w-full max-w-xs rounded-2xl p-4 space-y-3 border shadow-2xl">
      <h3 id="tabActionTitle" class="text-sm font-bold text-center border-b pb-2">清單選項</h3>
      <div class="space-y-2">
        <button onclick="executeTabRename()" class="w-full py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-2 hover:opacity-80 transition">
          ✏️ 重新命名清單
        </button>
        <button onclick="executeTabDelete()" class="w-full py-2.5 px-3 rounded-xl border border-rose-300 bg-rose-50 text-rose-700 text-xs font-semibold flex items-center justify-center gap-2 hover:bg-rose-100 transition">
          🗑️ 刪除此清單
        </button>
      </div>
      <button onclick="closeTabActionModal()" class="w-full py-2 rounded-xl border text-xs font-medium opacity-70 hover:opacity-100 transition">
        取消
      </button>
    </div>
  </div>

  <!-- 鼓勵讚賞管理 Modal -->
  <div id="praiseModal" class="fixed inset-0 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div id="praiseModalBox" class="max-w-md w-full rounded-2xl p-6 space-y-4 border shadow-2xl">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="text-lg font-bold">自訂鼓勵語錄庫</h3>
          <p class="text-xs opacity-60 mt-0.5">完成 Task 時將從此隨機抽取鼓勵</p>
        </div>
        <button onclick="closePraiseModal()" class="opacity-60 hover:opacity-100 text-sm">✕</button>
      </div>
      <div class="flex gap-2 pt-1">
        <input id="newPraiseIcon" type="text" value="✨" class="w-12 text-center text-sm px-2 py-2 border rounded-xl focus:outline-none" />
        <input id="newPraiseText" type="text" placeholder="輸入你想收到的鼓勵句子..." class="flex-1 text-xs px-3 py-2 border rounded-xl focus:outline-none" />
        <button onclick="addPraiseItem()" id="addPraiseBtn" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0">新增</button>
      </div>
      <div id="praiseListContainer" class="max-h-60 overflow-y-auto no-scrollbar space-y-2 border p-2.5 rounded-xl">
        <ul id="praiseItemsList" class="space-y-1.5"></ul>
      </div>
      <div class="flex justify-between items-center pt-2">
        <button onclick="resetDefaultPraises()" class="text-xs opacity-60 hover:opacity-100 underline">恢復預設</button>
        <button onclick="closePraiseModal()" id="praiseCloseBtn" class="px-4 py-2 border rounded-xl text-xs font-semibold transition">完成</button>
      </div>
    </div>
  </div>

  <!-- Task 詳情與編輯 Modal -->
  <div id="detailModal" class="fixed inset-0 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div id="detailModalBox" class="max-w-sm w-full rounded-2xl p-6 space-y-4 border shadow-2xl">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <span id="modalModeTag" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded">詳情</span>
          <button id="editToggleBtn" onclick="toggleEditMode()" class="text-xs font-medium underline">修改細節</button>
        </div>
        <button onclick="closeModal()" class="opacity-60 hover:opacity-100 text-sm">✕</button>
      </div>

      <div id="viewModeContainer" class="space-y-3">
        <h3 id="modalTitle" class="text-lg font-bold break-words"></h3>
        <div id="modalInfoBox" class="text-xs space-y-2 p-3.5 rounded-xl border">
          <div><strong>所屬清單：</strong><span id="modalListBadge" class="font-medium"></span></div>
          <div><strong>建立時間：</strong><span id="modalCreatedAt"></span></div>
          <div><strong>截止期限：</strong><span id="modalDueDate"></span></div>
          <div><strong>完成時間：</strong><span id="modalCompletedAt"></span></div>
          <div><strong>優先程度：</strong><span id="modalPriority"></span></div>
        </div>
      </div>

      <div id="editModeContainer" class="hidden space-y-3">
        <div>
          <label class="block text-[11px] font-semibold opacity-70 mb-1">任務名稱</label>
          <input id="editTitleInput" type="text" class="w-full text-sm px-3 py-2 border rounded-xl focus:outline-none" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold opacity-70 mb-1">所屬清單</label>
          <select id="editListSelect" class="w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold opacity-70 mb-1">優先程度</label>
            <select id="editPrioritySelect" class="w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none">
              <option value="High">高</option>
              <option value="Medium">中</option>
              <option value="Low">低</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold opacity-70 mb-1">截止日期</label>
            <input id="editDueDateInput" type="date" class="w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none" />
          </div>
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button id="modalActionBtn" onclick="closeModal()" class="w-full py-2 border rounded-xl text-xs font-semibold transition">
          關閉
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase 模組與資料邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      signOut, 
      GoogleAuthProvider, 
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot,
      enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5woha0e3n2vc03u82hN5UPwXemgiZjWM",
      authDomain: "todolist-2aa90.firebaseapp.com",
      projectId: "todolist-2aa90",
      storageBucket: "todolist-2aa90.firebasestorage.app",
      messagingSenderId: "318238770933",
      appId: "1:318238770933:web:52c3e67f2f98413d36a7bc",
      measurementId: "G-R5M4NTN97F"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db).catch(() => {});
    setPersistence(auth, browserLocalPersistence);

    let currentUser = null;
    let unsubscribeTasks = null;
    let unsubscribeCategories = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authBtn = document.getElementById('authBtn');
      if (user) {
        authBtn.innerText = '登出';
        authBtn.title = user.email;
        setDoc(doc(db, `users/${user.uid}`), {
          email: user.email,
          displayName: user.displayName || '',
          lastActiveAt: Date.now()
        }, { merge: true });

        bindFirestoreData(user.uid);
      } else {
        authBtn.innerText = 'Google 登入';
        if (unsubscribeTasks) unsubscribeTasks();
        if (unsubscribeCategories) unsubscribeCategories();
        tasks = [];
        categories = [
          { id: 'cat_work', name: '工作教案', order: 0 },
          { id: 'cat_life', name: '日常待辦', order: 1 }
        ];
        renderTabs();
        render();
      }
    });

    window.handleAuthAction = function() {
      if (currentUser) {
        if (confirm('確定要登出嗎？')) signOut(auth);
      } else {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => alert("登入失敗: " + err.message));
      }
    };

    function bindFirestoreData(uid) {
      const catRef = collection(db, `users/${uid}/categories`);
      unsubscribeCategories = onSnapshot(catRef, (snap) => {
        if (!snap.empty) {
          categories = [];
          snap.forEach(d => {
            const data = d.data();
            categories.push({ id: d.id, name: data.name, order: data.order ?? 999 });
          });
          categories.sort((a, b) => a.order - b.order);
        } else {
          const defaultCats = [
            { id: 'cat_work', name: '工作教案', order: 0 },
            { id: 'cat_life', name: '日常待辦', order: 1 }
          ];
          defaultCats.forEach(c => setDoc(doc(db, `users/${uid}/categories`, c.id), c));
          categories = defaultCats;
        }
        renderTabs();
      });

      const taskRef = collection(db, `users/${uid}/tasks`);
      unsubscribeTasks = onSnapshot(taskRef, (snap) => {
        tasks = [];
        snap.forEach(d => tasks.push({ id: d.id, ...d.data() }));
        applyCurrentSort();
      });
    }

    window.dbSaveTask = async (task) => {
      if (!currentUser) return;
      await setDoc(doc(db, `users/${currentUser.uid}/tasks`, task.id), task, { merge: true });
    };

    window.dbDeleteTask = async (taskId) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, `users/${currentUser.uid}/tasks`, taskId));
    };

    window.dbSaveCategory = async (cat) => {
      if (!currentUser) return;
      await setDoc(doc(db, `users/${currentUser.uid}/categories`, cat.id), { 
        name: cat.name, 
        order: cat.order ?? 0 
      }, { merge: true });
    };

    window.dbBatchUpdateCategories = async (cats) => {
      if (!currentUser) return;
      for (let i = 0; i < cats.length; i++) {
        cats[i].order = i;
        await setDoc(doc(db, `users/${currentUser.uid}/categories`, cats[i].id), { order: i }, { merge: true });
      }
    };

    window.dbDeleteCategory = async (catId) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, `users/${currentUser.uid}/categories`, catId));
    };
  </script>

  <!-- 主題、UI 與長按拖曳互動邏輯 -->
  <script>
    const themes = {
      warm: {
        bodyBg: '#FBF9F5',
        textColor: 'text-stone-800',
        borderColor: 'border-stone-200/80',
        cardBg: 'bg-white',
        cardShadow: 'shadow-sm border border-stone-200/80',
        inputBg: 'bg-stone-50 border-stone-200 text-stone-800',
        primaryBtn: 'bg-stone-800 text-stone-50 hover:bg-stone-700',
        subBtn: 'bg-white text-stone-600 border-stone-200 hover:bg-stone-50',
        activeTab: 'bg-stone-800 text-white',
        inactiveTab: 'bg-white text-stone-600 border-stone-200 hover:bg-stone-50',
        toast: 'bg-stone-800 text-stone-100 border-stone-700',
        modalBg: 'bg-white border-stone-200 text-stone-800',
        modalBox: 'bg-stone-50 border-stone-100 text-stone-600',
        priority: {
          High: 'bg-amber-100/70 text-amber-900 border-amber-300',
          Medium: 'bg-orange-50 text-orange-800 border-orange-200',
          Low: 'bg-emerald-50 text-emerald-800 border-emerald-200'
        },
        accentCheck: 'border-stone-300 bg-stone-50 hover:border-stone-600',
        checkedBg: 'bg-stone-700 text-stone-50'
      },
      apple: {
        bodyBg: '#F2F2F7',
        textColor: 'text-neutral-900',
        borderColor: 'border-neutral-200',
        cardBg: 'bg-white',
        cardShadow: 'shadow-sm border border-neutral-100',
        inputBg: 'bg-neutral-100 border-transparent text-neutral-900 focus:bg-white focus:border-blue-400',
        primaryBtn: 'bg-blue-600 text-white hover:bg-blue-500 shadow-sm',
        subBtn: 'bg-white text-neutral-700 border-neutral-200 hover:bg-neutral-50',
        activeTab: 'bg-blue-600 text-white shadow-sm',
        inactiveTab: 'bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50',
        toast: 'bg-neutral-900/90 backdrop-blur-md text-white border-neutral-800',
        modalBg: 'bg-white border-neutral-200 text-neutral-900',
        modalBox: 'bg-neutral-50 border-neutral-200/60 text-neutral-600',
        priority: {
          High: 'bg-red-50 text-red-600 border-red-200',
          Medium: 'bg-amber-50 text-amber-700 border-amber-200',
          Low: 'bg-emerald-50 text-emerald-700 border-emerald-200'
        },
        accentCheck: 'border-neutral-300 bg-neutral-50 hover:border-blue-500',
        checkedBg: 'bg-blue-600 text-white'
      },
      linear: {
        bodyBg: '#09090B',
        textColor: 'text-zinc-100',
        borderColor: 'border-zinc-800',
        cardBg: 'bg-zinc-900/90',
        cardShadow: 'border border-zinc-800/80',
        inputBg: 'bg-zinc-950 border-zinc-800 text-zinc-100 focus:border-zinc-600',
        primaryBtn: 'bg-zinc-100 text-zinc-950 hover:bg-zinc-200 font-semibold',
        subBtn: 'bg-zinc-900 text-zinc-300 border-zinc-800 hover:bg-zinc-800',
        activeTab: 'bg-zinc-100 text-zinc-950 font-bold',
        inactiveTab: 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:bg-zinc-800',
        toast: 'bg-zinc-900 text-zinc-100 border-zinc-700',
        modalBg: 'bg-zinc-900 border-zinc-800 text-zinc-100',
        modalBox: 'bg-zinc-950 border-zinc-800 text-zinc-400',
        priority: {
          High: 'bg-rose-950/60 text-rose-300 border-rose-800/60',
          Medium: 'bg-yellow-950/50 text-yellow-300 border-yellow-800/50',
          Low: 'bg-teal-950/50 text-teal-300 border-teal-800/50'
        },
        accentCheck: 'border-zinc-700 bg-zinc-950 hover:border-zinc-400',
        checkedBg: 'bg-zinc-200 text-zinc-950 font-bold'
      }
    };

    let currentThemeKey = localStorage.getItem('app_theme') || 'warm';

    function changeTheme(themeKey) {
      currentThemeKey = themeKey;
      localStorage.setItem('app_theme', themeKey);
      applyTheme();
    }

    function applyTheme() {
      const theme = themes[currentThemeKey];
      const body = document.getElementById('appBody');
      body.style.backgroundColor = theme.bodyBg;
      body.className = `min-h-screen flex flex-col items-center p-3 sm:p-8 relative ${theme.textColor}`;

      document.getElementById('themeSelector').className = `px-2.5 py-1.5 rounded-xl border text-xs font-medium focus:outline-none cursor-pointer ${theme.subBtn}`;
      document.getElementById('themeSelector').value = currentThemeKey;
      document.getElementById('praiseBtn').className = `px-2.5 py-1.5 rounded-xl border text-xs font-medium transition flex items-center gap-1 ${theme.subBtn}`;
      document.getElementById('sortBtn').className = `px-2.5 py-1.5 rounded-xl border text-xs font-medium transition ${theme.subBtn}`;
      document.getElementById('batchDelBtn').className = currentThemeKey === 'linear' 
        ? 'px-2.5 py-1.5 rounded-xl border border-rose-900/60 bg-rose-950/40 text-rose-300 text-xs font-medium hover:bg-rose-900/50 transition'
        : 'px-2.5 py-1.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-xs font-medium hover:bg-rose-100 transition';

      document.getElementById('appHeader').className = `flex flex-col items-center gap-3.5 border-b ${theme.borderColor} pb-4 w-full`;
      document.getElementById('completedSection').className = `space-y-3 pt-4 border-t ${theme.borderColor}`;
      document.getElementById('addListBtn').className = `px-3.5 py-1.5 rounded-xl border border-dashed ${theme.borderColor} text-xs font-medium whitespace-nowrap transition flex-shrink-0 opacity-70 hover:opacity-100`;

      const inputCard = document.getElementById('inputCard');
      inputCard.className = `w-full p-4 rounded-2xl ${theme.cardBg} ${theme.cardShadow} space-y-3`;
      document.getElementById('taskInput').className = `flex-1 px-3 py-2 text-sm rounded-xl border ${theme.inputBg}`;
      document.getElementById('taskTargetList').className = `w-full border rounded-lg px-2 py-1.5 focus:outline-none ${theme.inputBg}`;
      document.getElementById('taskPriority').className = `w-full border rounded-lg px-2 py-1.5 focus:outline-none ${theme.inputBg}`;
      document.getElementById('taskDueDate').className = `w-full border rounded-lg px-2 py-1.5 focus:outline-none ${theme.inputBg}`;
      document.getElementById('submitTaskBtn').className = `px-4 py-2 rounded-xl text-sm font-semibold transition ${theme.primaryBtn}`;

      document.getElementById('praiseToast').className = `fixed bottom-6 z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border ${theme.toast}`;
      document.getElementById('praiseModalBox').className = `max-w-md w-full rounded-2xl p-6 space-y-4 border shadow-2xl ${theme.modalBg}`;
      document.getElementById('newPraiseIcon').className = `w-12 text-center text-sm px-2 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;
      document.getElementById('newPraiseText').className = `flex-1 text-xs px-3 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;
      document.getElementById('addPraiseBtn').className = `px-3.5 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0 ${theme.primaryBtn}`;
      document.getElementById('praiseListContainer').className = `max-h-60 overflow-y-auto no-scrollbar space-y-2 border p-2.5 rounded-xl ${theme.modalBox}`;
      document.getElementById('praiseCloseBtn').className = `px-4 py-2 border rounded-xl text-xs font-semibold transition ${theme.subBtn}`;

      document.getElementById('detailModalBox').className = `max-w-sm w-full rounded-2xl p-6 space-y-4 border shadow-2xl ${theme.modalBg}`;
      document.getElementById('modalInfoBox').className = `text-xs space-y-2 p-3.5 rounded-xl border ${theme.modalBox}`;
      document.getElementById('editTitleInput').className = `w-full text-sm px-3 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;
      document.getElementById('editListSelect').className = `w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;
      document.getElementById('editPrioritySelect').className = `w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;
      document.getElementById('editDueDateInput').className = `w-full text-xs px-2.5 py-2 border rounded-xl focus:outline-none ${theme.inputBg}`;

      document.getElementById('tabActionBox').className = `w-full max-w-xs rounded-2xl p-4 space-y-3 border shadow-2xl ${theme.modalBg}`;

      renderTabs();
      render();
    }

    const defaultPraises = [
      { icon: '✨', text: '搞掂一單！今日又進步咗少少。' },
      { icon: '👏', text: '做得好！專注力滿分！' },
      { icon: '☕', text: '完成得好俐落，飲啖水放鬆下先！' },
      { icon: '🔥', text: '狀態大勇，節奏保持得好好！' },
      { icon: '🌱', text: '每日一小步，累積起嚟就係巨大成果！' },
      { icon: '🎯', text: '又清咗一件心事，個人即刻輕鬆哂！' },
      { icon: '💪', text: '執行力超強，繼續保持呢份動力！' }
    ];

    let praises = JSON.parse(localStorage.getItem('custom_praises')) || defaultPraises;

    function savePraises() {
      localStorage.setItem('custom_praises', JSON.stringify(praises));
    }

    let toastTimer = null;
    function triggerPraise() {
      if (praises.length === 0) return;
      const random = praises[Math.floor(Math.random() * praises.length)];
      const toast = document.getElementById('praiseToast');
      document.getElementById('toastIcon').innerText = random.icon || '✨';
      document.getElementById('toastMessage').innerText = random.text;

      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2600);
    }

    function openPraiseModal() {
      renderPraiseList();
      document.getElementById('praiseModal').classList.remove('hidden');
      document.getElementById('praiseModal').classList.add('flex');
    }

    function closePraiseModal() {
      document.getElementById('praiseModal').classList.add('hidden');
      document.getElementById('praiseModal').classList.remove('flex');
    }

    function renderPraiseList() {
      const list = document.getElementById('praiseItemsList');
      const theme = themes[currentThemeKey];
      list.innerHTML = '';
      praises.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-2 rounded-xl border text-xs ${theme.cardBg} ${theme.borderColor}`;
        li.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            <span class="text-sm">${item.icon}</span>
            <span class="truncate">${item.text}</span>
          </div>
          <button onclick="removePraiseItem(${index})" class="opacity-60 hover:text-rose-500 px-1.5 py-0.5 rounded transition">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addPraiseItem() {
      const textInput = document.getElementById('newPraiseText');
      const iconInput = document.getElementById('newPraiseIcon');
      const text = textInput.value.trim();
      const icon = iconInput.value.trim() || '✨';

      if (!text) return;
      praises.push({ icon, text });
      savePraises();
      renderPraiseList();
      textInput.value = '';
    }

    function removePraiseItem(index) {
      praises.splice(index, 1);
      savePraises();
      renderPraiseList();
    }

    function resetDefaultPraises() {
      if (confirm('確定要恢復預設語錄嗎？')) {
        praises = [...defaultPraises];
        savePraises();
        renderPraiseList();
      }
    }

    let categories = [
      { id: 'cat_work', name: '工作教案', order: 0 },
      { id: 'cat_life', name: '日常待辦', order: 1 }
    ];

    let currentTab = 'all';
    let currentViewingTaskId = null;
    let isEditing = false;
    let tasks = [];
    let currentSort = 'deadline';
    let draggedIndex = null;
    let draggedCategoryIndex = null;

    // 長按（Hold）管理邏輯
    let activeLongPressCatId = null;
    let longPressTimer = null;
    let isLongPressTriggered = false;

    function renderTabs() {
      const theme = themes[currentThemeKey];
      const container = document.getElementById('listTabsContainer');
      const select = document.getElementById('taskTargetList');
      container.innerHTML = '';
      select.innerHTML = '';

      // 1. 固定不可拖曳的「全部工作」Tab
      const allBtn = document.createElement('button');
      allBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap flex-shrink-0 ${currentTab === 'all' ? theme.activeTab : theme.inactiveTab}`;
      allBtn.innerText = '📋 全部工作 (All)';
      allBtn.onclick = () => switchTab('all');
      container.appendChild(allBtn);

      // 2. 支援自由拖曳換位與長按選單的各個自訂 Tab
      categories.forEach((cat, index) => {
        const isCurrent = currentTab === cat.id;
        const tab = document.createElement('div');
        tab.draggable = true;
        tab.className = `group flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap flex-shrink-0 cursor-pointer select-none active:scale-95 ${isCurrent ? theme.activeTab : theme.inactiveTab}`;

        tab.innerHTML = `<span>${cat.name}</span>`;

        // 桌面端拖曳換位
        tab.ondragstart = (e) => {
          draggedCategoryIndex = index;
          e.dataTransfer.effectAllowed = 'move';
        };
        tab.ondragover = (e) => e.preventDefault();
        tab.ondrop = (e) => {
          e.preventDefault();
          if (draggedCategoryIndex === null || draggedCategoryIndex === index) return;
          const moved = categories.splice(draggedCategoryIndex, 1)[0];
          categories.splice(index, 0, moved);
          if (window.dbBatchUpdateCategories) {
            window.dbBatchUpdateCategories(categories);
          }
          renderTabs();
        };

        // iOS / 手機觸控長按（Hold 500ms 彈出 Action Sheet）
        tab.addEventListener('touchstart', (e) => {
          isLongPressTriggered = false;
          longPressTimer = setTimeout(() => {
            isLongPressTriggered = true;
            if (navigator.vibrate) navigator.vibrate(40); // 震動反饋
            openTabActionModal(cat.id, cat.name);
          }, 500);
        }, { passive: true });

        tab.addEventListener('touchend', () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });

        tab.addEventListener('touchmove', () => {
          if (longPressTimer) clearTimeout(longPressTimer);
        });

        // 點擊事件（若觸發了長按則不執行切換）
        tab.onclick = () => {
          if (!isLongPressTriggered) {
            switchTab(cat.id);
          }
        };

        // 電腦端雙擊仍可改名
        tab.ondblclick = (e) => {
          e.stopPropagation();
          openTabActionModal(cat.id, cat.name);
        };

        container.appendChild(tab);

        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = cat.name;
        if (currentTab === cat.id) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // 長按選單開關
    function openTabActionModal(catId, catName) {
      activeLongPressCatId = catId;
      document.getElementById('tabActionTitle').innerText = `清單：${catName}`;
      const modal = document.getElementById('tabActionModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeTabActionModal() {
      const modal = document.getElementById('tabActionModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      activeLongPressCatId = null;
    }

    function executeTabRename() {
      const catId = activeLongPressCatId;
      closeTabActionModal();
      if (!catId) return;
      renameCategory(catId);
    }

    function executeTabDelete() {
      const catId = activeLongPressCatId;
      closeTabActionModal();
      if (!catId) return;
      deleteCategory(catId);
    }

    function switchTab(tabId) {
      currentTab = tabId;
      renderTabs();
      applyCurrentSort();
    }

    function renameCategory(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;
      const newName = prompt(`請輸入清單「${cat.name}」的新名稱：`, cat.name);
      if (newName && newName.trim() && newName.trim() !== cat.name) {
        cat.name = newName.trim();
        if (window.dbSaveCategory) window.dbSaveCategory(cat);
        renderTabs();
        render();
      }
    }

    function deleteCategory(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;

      const count = tasks.filter(t => t.listId === catId).length;
      const confirmMsg = count > 0 
        ? `確定要刪除清單「${cat.name}」嗎？該清單下的 ${count} 個任務將會同時被移除！` 
        : `確定要刪除清單「${cat.name}」嗎？`;

      if (confirm(confirmMsg)) {
        if (window.dbDeleteCategory) window.dbDeleteCategory(catId);
        tasks.filter(t => t.listId === catId).forEach(t => {
          if (window.dbDeleteTask) window.dbDeleteTask(t.id);
        });
        if (currentTab === catId) currentTab = 'all';
        renderTabs();
        applyCurrentSort();
      }
    }

    function promptAddNewList() {
      const name = prompt('請輸入新清單名稱：');
      if (!name || !name.trim()) return;
      const newId = 'cat_' + Date.now();
      const newCat = { id: newId, name: name.trim(), order: categories.length };
      categories.push(newCat);
      if (window.dbSaveCategory) window.dbSaveCategory(newCat);
      switchTab(newId);
    }

    function render() {
      const theme = themes[currentThemeKey];
      const activeList = document.getElementById('activeList');
      const completedList = document.getElementById('completedList');
      activeList.innerHTML = '';
      completedList.innerHTML = '';

      const filteredTasks = currentTab === 'all' 
        ? tasks 
        : tasks.filter(t => t.listId === currentTab);

      const activeTasks = filteredTasks.filter(t => !t.isCompleted);
      const completedTasks = filteredTasks.filter(t => t.isCompleted);

      document.getElementById('activeCount').innerText = activeTasks.length;
      document.getElementById('completedCount').innerText = completedTasks.length;

      activeTasks.forEach((task, index) => {
        const catName = categories.find(c => c.id === task.listId)?.name || '未分類';
        const li = document.createElement('li');
        li.draggable = true;
        li.className = `group flex items-center justify-between p-3 sm:p-3.5 rounded-2xl transition cursor-pointer select-none ${theme.cardBg} ${theme.cardShadow}`;
        
        li.ondragstart = () => { draggedIndex = index; };
        li.ondragover = (e) => e.preventDefault();
        li.ondrop = () => {
          if (draggedIndex === null || draggedIndex === index) return;
          const moved = activeTasks.splice(draggedIndex, 1)[0];
          activeTasks.splice(index, 0, moved);
          currentSort = 'manual';
          document.getElementById('sortBtn').innerText = '手動排序中';
          updateTasksOrder(activeTasks);
        };

        li.innerHTML = `
          <div class="flex items-center gap-2 min-w-0 flex-1" onclick="showDetail('${task.id}')">
            <span class="font-mono text-xs font-semibold opacity-40 w-5 flex-shrink-0">#${index + 1}</span>
            <button type="button" onclick="event.stopPropagation(); toggleTask('${task.id}')" class="p-1.5 -ml-1 flex-shrink-0 transition active:scale-90">
              <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition ${theme.accentCheck}">
              </div>
            </button>
            <div class="min-w-0 pr-2 flex-1">
              <div class="flex items-center gap-2">
                ${currentTab === 'all' ? `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium flex-shrink-0 border ${theme.borderColor}">${catName}</span>` : ''}
                <span class="text-sm font-medium truncate">${task.title}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0" onclick="showDetail('${task.id}')">
            <span class="text-[10px] px-2 py-0.5 rounded-full border ${theme.priority[task.priority]}">${task.priority}</span>
            <span class="text-xs opacity-50 font-mono">${task.dueDate || '無期限'}</span>
          </div>
        `;
        activeList.appendChild(li);
      });

      completedTasks.slice().reverse().forEach((task) => {
        const catName = categories.find(c => c.id === task.listId)?.name || '未分類';
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-2.5 sm:p-3 rounded-2xl border transition cursor-pointer ${theme.modalBox}`;
        li.onclick = () => showDetail(task.id);

        li.innerHTML = `
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <button type="button" onclick="event.stopPropagation(); toggleTask('${task.id}')" class="p-1.5 -ml-1 flex-shrink-0 active:scale-90 transition">
              <div class="w-6 h-6 rounded-lg flex items-center justify-center shadow-sm ${theme.checkedBg}">
                <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
              </div>
            </button>
            <div class="flex items-center gap-2 truncate pr-2">
              ${currentTab === 'all' ? `<span class="text-[10px] px-1.5 py-0.5 rounded flex-shrink-0 border ${theme.borderColor}">${catName}</span>` : ''}
              <span class="text-sm line-through truncate opacity-50">${task.title}</span>
            </div>
          </div>
          <span class="text-[11px] opacity-50 font-mono flex-shrink-0">完成於: ${task.completedAt}</span>
        `;
        completedList.appendChild(li);
      });
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.isCompleted = !task.isCompleted;
      if (task.isCompleted) {
        const now = new Date();
        task.completedAt = `${now.getMonth() + 1}月${now.getDate()}日 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        triggerPraise();
      } else {
        task.completedAt = null;
      }
      if (window.dbSaveTask) window.dbSaveTask(task);
      applyCurrentSort();
    }

    function addTask() {
      const title = document.getElementById('taskInput').value.trim();
      if (!title) return;
      const priority = document.getElementById('taskPriority').value;
      const dueDate = document.getElementById('taskDueDate').value;
      const targetList = document.getElementById('taskTargetList').value || 'cat_work';
      
      const now = new Date();
      const createdAt = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newTask = {
        id: Date.now().toString(),
        listId: targetList,
        title,
        priority,
        dueDate: dueDate || null,
        isCompleted: false,
        createdAt,
        completedAt: null
      };

      tasks.push(newTask);
      if (window.dbSaveTask) window.dbSaveTask(newTask);

      document.getElementById('taskInput').value = '';
      applyCurrentSort();
    }

    function toggleSortMode() {
      if (currentSort === 'deadline') {
        currentSort = 'created';
        document.getElementById('sortBtn').innerText = '依 建立時間 排序';
      } else {
        currentSort = 'deadline';
        document.getElementById('sortBtn').innerText = '依 Deadline 排序';
      }
      applyCurrentSort();
    }

    function applyCurrentSort() {
      if (currentSort === 'deadline') {
        tasks.sort((a, b) => (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : -1);
      } else if (currentSort === 'created') {
        tasks.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      }
      render();
    }

    function updateTasksOrder(newActiveList) {
      const currentActiveIds = new Set(newActiveList.map(t => t.id));
      const untouchedTasks = tasks.filter(t => !currentActiveIds.has(t.id));
      tasks = [...newActiveList, ...untouchedTasks];
      render();
    }

    function promptBatchDelete() {
      const activeInView = (currentTab === 'all' 
        ? tasks 
        : tasks.filter(t => t.listId === currentTab)).filter(t => !t.isCompleted);

      const input = prompt(`請輸入要刪除的當前畫面動態編號 (1 至 ${activeInView.length}，例如：1-2, 4):`);
      if (!input) return;

      const indicesToDelete = new Set();
      const parts = input.split(',').map(s => s.trim());
      parts.forEach(part => {
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(Number);
          if (!isNaN(start) && !isNaN(end)) {
            for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
              if (i >= 1 && i <= activeInView.length) indicesToDelete.add(i - 1);
            }
          }
        } else {
          const num = Number(part);
          if (!isNaN(num) && num >= 1 && num <= activeInView.length) {
            indicesToDelete.add(num - 1);
          }
        }
      });

      if (indicesToDelete.size === 0) {
        alert("未找到符合編號的任務。");
        return;
      }

      const idsToRemove = Array.from(indicesToDelete).map(idx => activeInView[idx].id);
      idsToRemove.forEach(id => {
        if (window.dbDeleteTask) window.dbDeleteTask(id);
      });
      tasks = tasks.filter(t => !idsToRemove.includes(t.id));
      render();
      alert(`已將選取的編號任務移至回收站。`);
    }

    function showDetail(id) {
      currentViewingTaskId = id;
      isEditing = false;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      updateModalView(task);

      document.getElementById('editTitleInput').value = task.title;
      document.getElementById('editPrioritySelect').value = task.priority;
      document.getElementById('editDueDateInput').value = task.dueDate || '';

      const editListSelect = document.getElementById('editListSelect');
      editListSelect.innerHTML = '';
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = cat.name;
        if (cat.id === task.listId) opt.selected = true;
        editListSelect.appendChild(opt);
      });

      renderModalState();

      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function updateModalView(task) {
      const catName = categories.find(c => c.id === task.listId)?.name || '未分類';
      document.getElementById('modalTitle').innerText = task.title;
      document.getElementById('modalListBadge').innerText = catName;
      document.getElementById('modalCreatedAt').innerText = task.createdAt;
      document.getElementById('modalDueDate').innerText = task.dueDate || '無期限';
      document.getElementById('modalCompletedAt').innerText = task.completedAt || '未完成';
      document.getElementById('modalPriority').innerText = task.priority;
    }

    function toggleEditMode() {
      isEditing = !isEditing;
      renderModalState();
    }

    function renderModalState() {
      const theme = themes[currentThemeKey];
      const viewContainer = document.getElementById('viewModeContainer');
      const editContainer = document.getElementById('editModeContainer');
      const modeTag = document.getElementById('modalModeTag');
      const editToggleBtn = document.getElementById('editToggleBtn');
      const actionBtn = document.getElementById('modalActionBtn');

      if (isEditing) {
        viewContainer.classList.add('hidden');
        editContainer.classList.remove('hidden');
        modeTag.innerText = '編輯模式';
        editToggleBtn.innerText = '取消修改';
        actionBtn.innerText = '儲存修改';
        actionBtn.className = `w-full py-2 rounded-xl text-xs font-semibold transition ${theme.primaryBtn}`;
        actionBtn.onclick = saveTaskEdit;
      } else {
        viewContainer.classList.remove('hidden');
        editContainer.classList.add('hidden');
        modeTag.innerText = '詳情';
        editToggleBtn.innerText = '修改細節';
        actionBtn.innerText = '關閉';
        actionBtn.className = `w-full py-2 border rounded-xl text-xs font-semibold transition ${theme.subBtn}`;
        actionBtn.onclick = closeModal;
      }
    }

    function saveTaskEdit() {
      const task = tasks.find(t => t.id === currentViewingTaskId);
      if (!task) return;

      const newTitle = document.getElementById('editTitleInput').value.trim();
      if (!newTitle) {
        alert("任務名稱不能為空！");
        return;
      }

      task.title = newTitle;
      task.listId = document.getElementById('editListSelect').value;
      task.priority = document.getElementById('editPrioritySelect').value;
      task.dueDate = document.getElementById('editDueDateInput').value || null;

      if (window.dbSaveTask) window.dbSaveTask(task);

      updateModalView(task);
      isEditing = false;
      renderModalState();
      applyCurrentSort();
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
      currentViewingTaskId = null;
      isEditing = false;
    }

    applyTheme();
    applyCurrentSort();
  </script>
</body>
